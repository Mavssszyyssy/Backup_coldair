name: Verify project

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            front/package-lock.json
            backend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: front
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Validate imports and letter casing
        run: node scripts/check-imports.js
      - name: Build frontend
        # Create React App treats ESLint warnings as build errors when GitHub
        # Actions supplies CI=true. Keep the warnings visible without blocking
        # a valid production build.
        run: CI=false npm run build
        working-directory: front
      - name: Load backend modules
        # The app configures a Mongo-backed session store during import. That
        # store keeps a connection handle open, so explicitly finish after the
        # synchronous module-load check succeeds instead of leaving CI running.
        run: node -e "require('./src/app'); console.log('Backend modules loaded successfully.'); process.exit(0)"
        working-directory: backend
