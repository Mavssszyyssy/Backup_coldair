name: Verify project

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  imports:
    name: Validate imports
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate imports and letter casing
        run: node scripts/check-imports.js

  frontend:
    name: Verify frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: front
      - name: Build production frontend
        # Keep ESLint warnings visible without treating warnings as build errors.
        run: CI=false npm run build
        working-directory: front
      - name: Test frontend
        run: npm test
        working-directory: front

  backend:
    name: Verify backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: backend
      - name: Test backend
        run: npm test
        working-directory: backend
      - name: Validate Vercel entry point
        run: npm run check:vercel
        working-directory: backend

  mobile:
    name: Verify mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bork5/caact-mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: bork5/caact-mobile
      - name: Test mobile
        run: npm test
        working-directory: bork5/caact-mobile
